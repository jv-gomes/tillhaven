version: 1
applications:
  - appRoot: apps/client
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm install -g pnpm@11.15.1
            - pnpm --version
            - pnpm install --frozen-lockfile

        build:
          commands:
            - pnpm --filter @tillhaven/client build
            - echo "=== CHECK DIST ==="
            - ls -lah apps/client/dist/assets/crop-spring-onion.png
            - echo "=== IMAGE FILES ==="
            - find apps/client/dist -iname "*.png" | head -30

      artifacts:
        baseDirectory: apps/client/dist
        files:
          - '**/*'

      cache:
        paths:
          - node_modules/**/*
          - apps/client/node_modules/**/*
          - packages/shared/node_modules/**/*
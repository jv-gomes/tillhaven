services:
  postgres:
    image: postgres:16-alpine
    container_name: tillhaven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tillhaven
      POSTGRES_PASSWORD: tillhaven
      POSTGRES_DB: tillhaven
    ports:
      - '5432:5432'
    volumes:
      - tillhaven-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tillhaven -d tillhaven']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tillhaven-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - tillhaven-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tillhaven-pgdata:
  tillhaven-redisdata:
